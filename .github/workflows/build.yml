name: Build Portable

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v0.1.2)'
        required: true
        default: 'v0.1.2'
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: '22.19.0'
  PNPM_VERSION: '11.7.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: 'deepseek-ai/deepseek-harness'
          ref: 'master'
          path: 'harness'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        working-directory: harness
        run: pnpm install --frozen-lockfile

      - name: Build project
        working-directory: harness
        run: pnpm build

      - name: Build web frontend
        working-directory: harness
        run: pnpm run build:web || echo "Web build skipped"

      - name: Build CLI explicitly
        working-directory: harness
        run: |
          pnpm exec tsc -b apps/cli/tsconfig.json
          pnpm exec tsdown --config apps/cli/tsdown.config.ts
          if [ -f "apps/cli/lib/bin.js" ]; then
            echo "✅ CLI built: apps/cli/lib/bin.js"
            ls -la apps/cli/lib/bin.js
          else
            echo "❌ CLI build failed"
            find apps/cli/lib -type f 2>/dev/null || echo "lib/ not found"
            exit 1
          fi

      - name: Create portable package
        run: |
          mkdir -p portable
          # rsync -aL: archive mode + follow symlinks, handles cyclic symlinks
          rsync -aL harness/apps portable/
          rsync -aL harness/packages portable/
          rsync -aL harness/vendor portable/
          rsync -aL harness/native portable/ 2>/dev/null || true
          cp harness/package.json portable/
          cp harness/pnpm-workspace.yaml portable/ 2>/dev/null || true
          cp harness/pnpm-lock.yaml portable/ 2>/dev/null || true
          rsync -aL harness/node_modules portable/
          echo "✅ Portable package created"
          du -sh portable/
          ls -la portable/apps/cli/lib/bin.js

      - name: Create launcher scripts
        run: |
          # Windows launcher
          printf '%s\n' \
            '@echo off' \
            'chcp 65001 >nul' \
            'title DeepSeek Harness Portable' \
            '' \
            'cd /d "%~dp0"' \
            '' \
            'echo ========================================' \
            'echo   DeepSeek Harness Portable' \
            'echo   URL: http://127.0.0.1:3000' \
            'echo   Press Ctrl+C to stop' \
            'echo ========================================' \
            'echo.' \
            '' \
            'node apps\cli\lib\bin.js web --port 3000' \
            '' \
            'pause' \
            > portable/launcher.bat

          # Linux/macOS launcher
          printf '%s\n' \
            '#!/bin/bash' \
            'cd "$(dirname "$0")"' \
            '' \
            'echo "========================================"' \
            'echo "  DeepSeek Harness Portable"' \
            'echo "  URL: http://127.0.0.1:3000"' \
            'echo "  Press Ctrl+C to stop"' \
            'echo "========================================"' \
            'echo ""' \
            '' \
            'node apps/cli/lib/bin.js web --port 3000' \
            > portable/launcher.sh
          chmod +x portable/launcher.sh

          # README
          printf '%s\n' \
            '# DeepSeek Harness Portable' \
            '' \
            '## Quick Start' \
            '' \
            '### Windows' \
            'Double-click `launcher.bat`' \
            '' \
            '### Linux/macOS' \
            '```bash' \
            './launcher.sh' \
            '```' \
            '' \
            'Then open http://127.0.0.1:3000' \
            '' \
            '## Requirements' \
            '' \
            '- Node.js 22.19+' \
            > portable/README.md

      - name: Verify startup
        working-directory: portable
        run: |
          ls -la apps/cli/lib/bin.js
          node apps/cli/lib/bin.js web --port 3000 &
          PID=$!
          sleep 8

          if kill -0 $PID 2>/dev/null; then
            echo "✅ Startup verification passed"
            if curl -sf -o /dev/null http://127.0.0.1:3000; then
              echo "✅ HTTP endpoint responding"
            else
              echo "⚠️ HTTP not responding yet (may need more time)"
            fi
            kill $PID 2>/dev/null || true
            wait $PID 2>/dev/null || true
          else
            echo "❌ Startup FAILED"
            exit 1
          fi

      - name: Package tarball
        run: |
          # -h: follow symlinks, dereference them into actual files
          # This is critical for Windows compatibility - symlinks break on extract
          tar -chzf "DeepSeekHarness-Portable.tar.gz" portable
          ls -lh DeepSeekHarness-Portable.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-portable
          path: DeepSeekHarness-Portable.tar.gz
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --repo 849276022/deepseek-harness-portable \
            DeepSeekHarness-Portable.tar.gz \
            --title "DeepSeek Harness Portable $TAG" \
            --notes "## Downloads

          - **DeepSeekHarness-Portable.tar.gz**: Full portable package

          ## Usage
          1. Extract: tar -xzf DeepSeekHarness-Portable.tar.gz
          2. Run: launcher.bat (Windows) or ./launcher.sh (Linux/macOS)
          3. Open: http://127.0.0.1:3000

          ## Requirements
          - Node.js 22.19+
          "
