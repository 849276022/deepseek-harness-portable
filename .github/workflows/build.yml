name: Build Portable

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v0.1.2)'
        required: true
        default: 'v0.2.0'
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: '22.19.0'
  PNPM_VERSION: '11.7.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout self (plugins + workflow)
        uses: actions/checkout@v4
        with:
          path: 'self'

      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: 'deepseek-ai/deepseek-harness'
          ref: 'master'
          path: 'harness'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies (hoisted)
        working-directory: harness
        run: |
          # --shamefully-hoist: 扁平化 node_modules，避免深层符号链接
          # 这样 Windows 解压后不会断链
          pnpm install --shamefully-hoist --frozen-lockfile

      - name: Build project
        working-directory: harness
        run: pnpm build

      - name: Build web frontend
        working-directory: harness
        run: pnpm run build:web || echo "Web build skipped"

      - name: Build CLI explicitly
        working-directory: harness
        run: |
          pnpm exec tsc -b apps/cli/tsconfig.json
          pnpm exec tsdown --config apps/cli/tsdown.config.ts
          if [ -f "apps/cli/lib/bin.js" ]; then
            echo "✅ CLI built: apps/cli/lib/bin.js"
            ls -la apps/cli/lib/bin.js
          else
            echo "❌ CLI build failed"
            find apps/cli/lib -type f 2>/dev/null || echo "lib/ not found"
            exit 1
          fi

      - name: Download Node.js portable
        run: |
          # 下载 Node.js 便携版 (Windows x64)
          mkdir -p portable
          NODE_URL="https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-win-x64.zip"
          echo "Downloading Node.js from: $NODE_URL"
          curl -sL "$NODE_URL" -o node.zip
          unzip -q node.zip
          mv "node-v${NODE_VERSION}-win-x64" portable/node
          rm node.zip
          echo "✅ Node.js portable downloaded"
          ls -la portable/node/

      - name: Create portable package
        run: |
          mkdir -p portable/src
          # 只复制源码，不复制 node_modules
          # Windows 上首次运行时执行 pnpm install
          cp -r harness/apps portable/src/
          cp -r harness/packages portable/src/
          cp -r harness/vendor portable/src/
          cp -r harness/native portable/src/ 2>/dev/null || true
          cp -r harness/patches portable/src/ 2>/dev/null || true
          cp -r harness/scripts portable/src/ 2>/dev/null || true
          cp harness/package.json portable/src/
          cp harness/pnpm-workspace.yaml portable/src/ 2>/dev/null || true
          cp harness/pnpm-lock.yaml portable/src/ 2>/dev/null || true
          # 复制构建产物（CLI 已编译）
          echo "✅ Portable package created (source only)"
          du -sh portable/
          ls -la portable/src/apps/cli/lib/bin.js

      - name: Bundle QQ Bot plugin
        run: |
          # 把本仓库自带的 QQ Bot 组合包放进便携目录。
          # 用 dsh 的 bundle 机制（package.json 里的 dsh.bundle + cordis.patch.yml），
          # 不改动上游源码树，上游更新不会与之冲突。
          # 插件是纯 JS，无需编译；仓库内不含任何凭据，全部由用户在设置页填写。
          # 注意：本仓库检出在 self/，上游检出在 harness/，两者是并列目录。
          SRC="self/plugins/dsh-qqbot"
          if [ ! -d "$SRC" ]; then
            echo "❌ $SRC not found"
            echo "--- workspace 内容 ---"
            ls -la
            exit 1
          fi
          mkdir -p portable/plugins
          cp -r "$SRC" portable/plugins/
          # 完整性校验：三个必需文件缺一不可
          for f in package.json cordis.patch.yml index.js; do
            if [ ! -f "portable/plugins/dsh-qqbot/$f" ]; then
              echo "❌ missing plugins/dsh-qqbot/$f"
              exit 1
            fi
          done
          # 语法自检，避免把坏文件打进发布包
          node --check portable/plugins/dsh-qqbot/index.js
          # 守卫：确保没有凭据被误提交进插件
          if grep -nE '"(appId|token|appSecret)"[[:space:]]*:[[:space:]]*"[^"]+"' portable/plugins/dsh-qqbot/index.js; then
            echo "❌ hardcoded credential detected in qqbot plugin"
            exit 1
          fi
          echo "✅ QQ Bot plugin bundled (no credentials, syntax OK)"
          ls -la portable/plugins/dsh-qqbot/

      - name: Create launcher scripts
        run: |
          # Windows launcher - 使用内置 node.exe，自动安装 pnpm
          # 注意：不用中文，避免编码问题
          printf '%s\n' \
            '@echo off' \
            'chcp 65001 >nul' \
            'title DeepSeek Harness Portable' \
            '' \
            'cd /d "%~dp0"' \
            '' \
            'echo ========================================' \
            'echo   DeepSeek Harness Portable' \
            'echo ========================================' \
            'echo.' \
            '' \
            'REM Set internal Node.js path' \
            'set "NODE_EXE=%~dp0node\node.exe"' \
            'set "NPM_EXE=%~dp0node\npm.cmd"' \
            'set "PATH=%~dp0node;%PATH%"' \
            '' \
            'REM Set portable data directories (config, memory, credentials)' \
            'set "DSH_HOME=%~dp0data\.dsh"' \
            'set "DSH_AGENTS_HOME=%~dp0data\.agents"' \
            '' \
            'REM Check node.exe exists' \
            'if not exist "%NODE_EXE%" (' \
            '    echo [ERROR] Node.js not found!' \
            '    pause' \
            '    exit /b 1' \
            ')' \
            '' \
            'REM Check pnpm, install if missing' \
            'where pnpm >nul 2>nul' \
            'if errorlevel 1 (' \
            '    echo [First Run] Installing pnpm...' \
            '    "%NPM_EXE%" install -g pnpm' \
            '    if errorlevel 1 (' \
            '        echo [ERROR] Failed to install pnpm!' \
            '        pause' \
            '        exit /b 1' \
            '    )' \
            '    echo [OK] pnpm installed' \
            '    echo.' \
            ')' \
            '' \
            'REM Check node_modules, install if missing' \
            'if not exist "src\node_modules" (' \
            '    echo [First Run] Installing dependencies...' \
            '    echo This may take a few minutes, please wait...' \
            '    echo.' \
            '    cd src' \
            '    pnpm install --shamefully-hoist --frozen-lockfile' \
            '    if errorlevel 1 (' \
            '        echo.' \
            '        echo [ERROR] Failed to install dependencies!' \
            '        echo Please check your network connection.' \
            '        echo.' \
            '        pause' \
            '        exit /b 1' \
            '    )' \
            '    cd ..' \
            '    echo.' \
            '    echo [OK] Dependencies installed!' \
            '    echo.' \
            ')' \
            '' \
            'REM Install bundled QQ Bot plugin into the SAME profile that `web` boots.' \
            'REM `bin.js web` is a hardcoded alias for `--profile web`: installing into' \
            'REM any other profile makes the plugin silently never load.' \
            'if exist "%~dp0plugins\dsh-qqbot\package.json" (' \
            '    if not exist "%~dp0data\.dsh\profiles\web\node_modules\dsh-qqbot" (' \
            '        echo [First Run] Installing QQ Bot plugin into profile: web ...' \
            '        cd src' \
            '        "%NODE_EXE%" apps\cli\lib\bin.js plugin --profile web add "%~dp0plugins\dsh-qqbot"' \
            '        if errorlevel 1 (' \
            '            echo [WARN] QQ Bot plugin install failed, continuing without it.' \
            '        ) else (' \
            '            echo [OK] QQ Bot plugin installed into profile web' \
            '        )' \
            '        cd ..' \
            '        echo.' \
            '    )' \
            ')' \
            '' \
            'echo   URL: http://127.0.0.1:3000' \
            'echo   Press Ctrl+C to stop' \
            'echo ========================================' \
            'echo.' \
            '' \
            'cd src' \
            '"%NODE_EXE%" apps\cli\lib\bin.js web --port 3000' \
            '' \
            'pause' \
            > portable/launcher.bat

          # Linux/macOS launcher
          printf '%s\n' \
            '#!/bin/bash' \
            'cd "$(dirname "$0")"' \
            '' \
            'echo "========================================"' \
            'echo "  DeepSeek Harness Portable"' \
            'echo "========================================"' \
            'echo ""' \
            '' \
            '# 检查 node_modules 是否存在' \
            'if [ ! -d "node_modules" ]; then' \
            '    echo "[首次运行] 正在安装依赖..."' \
            '    echo "这可能需要几分钟，请耐心等待..."' \
            '    echo ""' \
            '    pnpm install --shamefully-hoist --frozen-lockfile' \
            '    if [ $? -ne 0 ]; then' \
            '        echo ""' \
            '        echo "❌ 依赖安装失败！请检查："' \
            '        echo "   1. 是否已安装 pnpm: npm install -g pnpm"' \
            '        echo "   2. 网络连接是否正常"' \
            '        echo ""' \
            '        exit 1' \
            '    fi' \
            '    echo ""' \
            '    echo "✅ 依赖安装完成！"' \
            '    echo ""' \
            'fi' \
            '' \
            '# Install bundled QQ Bot plugin into the SAME profile that `web` boots.' \
            '# `bin.js web` is a hardcoded alias for `--profile web`: installing into' \
            '# any other profile makes the plugin silently never load.' \
            'if [ -f "plugins/dsh-qqbot/package.json" ] && [ ! -f "data/.dsh/profiles/web/node_modules/dsh-qqbot/package.json" ]; then' \
            '    echo "[首次运行] 正在安装 QQ Bot 插件到 profile: web ..."' \
            '    export DSH_HOME="$(pwd)/data/.dsh"' \
            '    if (cd src && node apps/cli/lib/bin.js plugin --profile web add "../plugins/dsh-qqbot"); then' \
            '        echo "✅ QQ Bot 插件已安装到 profile web"' \
            '    else' \
            '        echo "⚠️  QQ Bot 插件安装失败，将继续启动"' \
            '    fi' \
            '    echo ""' \
            'fi' \
            '' \
            'echo "  URL: http://127.0.0.1:3000"' \
            'echo "  Press Ctrl+C to stop"' \
            'echo "========================================"' \
            'echo ""' \
            '' \
            'node apps/cli/lib/bin.js web --port 3000' \
            > portable/launcher.sh
          chmod +x portable/launcher.sh

          # README
          printf '%s\n' \
            '# DeepSeek Harness Portable' \
            '' \
            '## Quick Start' \
            '' \
            '### Windows' \
            'Double-click `launcher.bat`' \
            '' \
            '### Linux/macOS' \
            '```bash' \
            './launcher.sh' \
            '```' \
            '' \
            '**首次运行**会自动安装依赖（需要 pnpm），可能需要几分钟。' \
            '' \
            'Then open http://127.0.0.1:3000' \
            '' \
            '## Requirements' \
            '' \
            '- Node.js 22.19+' \
            '- pnpm (`npm install -g pnpm`)' \
            > portable/README.md

      - name: Verify startup
        working-directory: portable/src
        run: |
          ls -la apps/cli/lib/bin.js
          # 安装依赖（验证环境）
          echo "安装依赖..."
          pnpm install --shamefully-hoist --frozen-lockfile
          echo "启动验证..."
          node apps/cli/lib/bin.js web --port 3000 &
          PID=$!
          sleep 8

          if kill -0 $PID 2>/dev/null; then
            echo "✅ Startup verification passed"
            if curl -sf -o /dev/null http://127.0.0.1:3000; then
              echo "✅ HTTP endpoint responding"
            else
              echo "⚠️ HTTP not responding yet (may need more time)"
            fi
            kill $PID 2>/dev/null || true
            wait $PID 2>/dev/null || true
          else
            echo "❌ Startup FAILED"
            exit 1
          fi

      - name: Verify QQ Bot plugin loads
        working-directory: portable/src
        run: |
          # 必须放在 Verify startup 之后：pnpm install 在那一步执行，
          # 否则 CLI 连自身依赖（commander）都找不到，任何子命令都跑不起来。
          #
          # 这一步验证三层，缺一层就是假绿：
          #   1) 能装进 web profile（`bin.js web` 只读 web，装别的 profile 等于没装）
          #   2) 解析后的配置树里有 qqbot
          #   3) 真启动 web 服务，插件的 apply 真的执行、settings namespace 真的注册
          # 前两层 v0.2.2 就有了，但恰恰是第 3 层缺失导致「CI 全绿、设置页空白」。
          set -e
          export DSH_HOME="$GITHUB_WORKSPACE/portable/data/.dsh"
          mkdir -p "$DSH_HOME"

          echo "--- 1/3 安装插件到 web profile（与 launcher 启动的 profile 一致）---"
          node apps/cli/lib/bin.js plugin --profile web add "$GITHUB_WORKSPACE/portable/plugins/dsh-qqbot"

          echo "--- 2/3 解析生效配置 ---"
          node apps/cli/lib/bin.js --profile web --dump-config > dump.yml
          if grep -q "qqbot" dump.yml; then
            echo "✅ qqbot 已出现在解析后的配置中"
            grep -n -A3 "qqbot" dump.yml | head -20
          else
            echo "❌ 解析后的配置中没有 qqbot"
            head -60 dump.yml
            exit 1
          fi

          echo "--- 3/3 真启动验证：插件 apply 是否执行、settings 是否注册 ---"
          # 插件在 apply 里打印加载日志；启动失败会带 ERR_MODULE_NOT_FOUND 之类退出。
          # 用超时包住：服务是常驻进程，拿到日志就够，不需要它一直跑。
          set +e
          timeout 90 node apps/cli/lib/bin.js web --port 3999 --no-open > boot.log 2>&1
          set -e

          echo "--- 启动日志 ---"
          cat boot.log

          if grep -q "ERR_MODULE_NOT_FOUND\|plugin tree failed to load\|failed to import loader entry" boot.log; then
            echo "❌ 启动时插件加载失败（依赖解析或 patch 有问题）"
            exit 1
          fi

          if grep -q "dsh web: http" boot.log; then
            echo "✅ web 服务带着 qqbot 插件成功启动"
          else
            echo "❌ web 服务没有正常启动"
            exit 1
          fi

          echo "--- 清理验证残留 ---"
          rm -f dump.yml boot.log
          rm -rf "$DSH_HOME/profiles/web"

      - name: Package tarball
        run: |
          # 打包前清理 node_modules（首次运行会重新安装）
          rm -rf portable/src/node_modules
          # 清理 CI 验证产生的临时 profile 与依赖，避免混入发布包
          rm -rf portable/data
          # 确认插件目录仍在包内
          ls -la portable/plugins/dsh-qqbot/
          tar -czf "DeepSeekHarness-Portable.tar.gz" portable
          ls -lh DeepSeekHarness-Portable.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-portable
          path: DeepSeekHarness-Portable.tar.gz
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --repo 849276022/deepseek-harness-portable \
            DeepSeekHarness-Portable.tar.gz \
            --title "DeepSeek Harness Portable $TAG" \
            --notes "## Downloads

          - **DeepSeekHarness-Portable.tar.gz**: Full portable package

          ## Usage
          1. Extract: tar -xzf DeepSeekHarness-Portable.tar.gz
          2. Run: launcher.bat (Windows) or ./launcher.sh (Linux/macOS)
          3. Open: http://127.0.0.1:3000

          ## Requirements
          - Node.js 22.19+
          "
