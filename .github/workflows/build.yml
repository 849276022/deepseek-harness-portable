name: Build DeepSeek Harness Portable

# Force refresh workflow cache
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.1-rc.3)'
        required: true
        default: 'v0.1.1-rc.3'
      include_node:
        description: 'Bundle Node.js runtime'
        required: true
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: '22.22.1'
  PNPM_VERSION: '11.23.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          repository: 'deepseek-ai/deepseek-harness'
          ref: 'master'
          path: 'harness'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            harness/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('harness/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Initialize Git repository
        run: |
          cd harness
          git init
          git config user.email "build@github.com"
          git config user.name "GitHub Actions"
          git commit --allow-empty -m "init"

      - name: Install dependencies
        run: |
          cd harness
          export CI=true
          pnpm install

      - name: Build project
        run: |
          cd harness
          pnpm build

      - name: Build web frontend
        run: |
          cd harness
          pnpm run build:web

      - name: Clean up for portable version
        run: |
          cd harness
          rm -rf node_modules/.cache
          rm -rf apps/*/node_modules/.cache
          rm -rf packages/*/node_modules/.cache
          find . -type d -name "__tests__" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name "test" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name "tests" -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name "*.md" ! -name "README.md" -delete 2>/dev/null || true
          find apps packages vendor -type f \( -name "*.ts" -o -name "*.tsx" \) ! -name "*.d.ts" -delete 2>/dev/null || true

      - name: Download Node.js for Windows
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.include_node == 'true'
        run: |
          mkdir -p node-win-x64
          curl -L "https://nodejs.org/dist/v${{ env.NODE_VERSION }}/node-v${{ env.NODE_VERSION }}-win-x64.zip" -o node-win.zip
          unzip -q node-win.zip
          cp -r node-v${{ env.NODE_VERSION }}-win-x64/* node-win-x64/
          rm -rf node-win.zip node-v${{ env.NODE_VERSION }}-win-x64

      - name: Create portable package
        run: |
          mkdir -p deepseek-harness-portable
          mv harness deepseek-harness-portable/harness
          if [ -d "node-win-x64" ]; then
            cp -r node-win-x64 deepseek-harness-portable/harness/
          fi

      - name: Create launchers and README
        run: |
          PKG=deepseek-harness-portable/harness

          # Windows launcher (pure ASCII, no BOM)
          printf '%s\n' \
            '@echo off' \
            'chcp 65001 >nul' \
            'title DeepSeek Harness Launcher' \
            '' \
            'cd /d "%~dp0"' \
            '' \
            'if exist "%~dp0node-win-x64\node.exe" (' \
            '    set "NODE_PATH=%~dp0node-win-x64\node.exe"' \
            '    set "PATH=%~dp0node-win-x64;%PATH%"' \
            ') else (' \
            '    set "NODE_PATH=node"' \
            ')' \
            '' \
            'if not exist "%NODE_PATH%" (' \
            '    echo [ERROR] Node.js not found' \
            '    echo Install Node.js 22+ from https://nodejs.org/' \
            '    pause' \
            '    exit /b 1' \
            ')' \
            '' \
            'echo [OK] Node.js found' \
            'call "%NODE_PATH%" -v' \
            '' \
            'echo [OK] Checking pnpm...' \
            'call pnpm -v >nul 2>&1' \
            'if errorlevel 1 (' \
            '    echo Installing pnpm...' \
            '    call npm install -g pnpm' \
            ')' \
            '' \
            'if not exist "node_modules" (' \
            '    echo Installing dependencies...' \
            '    set CI=true' \
            '    call pnpm install' \
            ')' \
            '' \
            'git rev-parse HEAD >nul 2>&1' \
            'if errorlevel 1 (' \
            '    git init >nul 2>&1' \
            '    git config user.email "test@test.com"' \
            '    git config user.name "Test"' \
            '    git commit --allow-empty -m "init" >nul 2>&1' \
            ')' \
            '' \
            'echo.' \
            'echo ========================================' \
            'echo   Starting DeepSeek Harness...' \
            'echo   URL: http://127.0.0.1:3000' \
            'echo   Press Ctrl+C to stop' \
            'echo ========================================' \
            'echo.' \
            '' \
            '"%NODE_PATH%" apps\cli\lib\bin.js web --port 3000' \
            '' \
            'pause' \
            > "$PKG/launcher.bat"

          # Linux/macOS launcher
          printf '%s\n' \
            '#!/bin/bash' \
            'cd "$(dirname "$0")"' \
            '' \
            'if ! command -v node &> /dev/null; then' \
            '    echo "Error: Node.js not found"' \
            '    echo "Install Node.js 22+: https://nodejs.org/"' \
            '    exit 1' \
            'fi' \
            '' \
            'if ! command -v pnpm &> /dev/null; then' \
            '    echo "Installing pnpm..."' \
            '    npm install -g pnpm' \
            'fi' \
            '' \
            'if [ ! -d "node_modules" ]; then' \
            '    echo "Installing dependencies..."' \
            '    CI=true pnpm install' \
            'fi' \
            '' \
            'git rev-parse HEAD > /dev/null 2>&1' \
            'if [ $? -ne 0 ]; then' \
            '    git init > /dev/null 2>&1' \
            '    git config user.email "test@test.com"' \
            '    git config user.name "Test"' \
            '    git commit --allow-empty -m "init" > /dev/null 2>&1' \
            'fi' \
            '' \
            'echo ""' \
            'echo "========================================"' \
            'echo "  Starting DeepSeek Harness..."' \
            'echo "  URL: http://127.0.0.1:3000"' \
            'echo "  Press Ctrl+C to stop"' \
            'echo "========================================"' \
            'echo ""' \
            '' \
            'node apps/cli/lib/bin.js web --port 3000' \
            > "$PKG/launcher.sh"
          chmod +x "$PKG/launcher.sh"

          # README
          printf '%s\n' \
            '# DeepSeek Harness Portable' \
            '' \
            '## Quick Start' \
            '' \
            '### Windows' \
            'Double-click `launcher.bat`' \
            '' \
            '### Linux/macOS' \
            '```bash' \
            './launcher.sh' \
            '```' \
            '' \
            'Then open http://127.0.0.1:3000' \
            '' \
            '## Requirements' \
            '' \
            '- Node.js 22+ (bundled in Full version)' \
            '- pnpm 11+ (auto-installed)' \
            '' \
            '## Versions' \
            '' \
            '- **Full**: Includes Node.js runtime + all dependencies, extract and run' \
            '- **Lite**: Dependencies only, requires Node.js installed separately' \
            > deepseek-harness-portable/README.md

      - name: Package Full version (tar.gz)
        run: |
          tar -czf "DeepSeekHarness-Portable-Full.tar.gz" deepseek-harness-portable
          ls -lh DeepSeekHarness-Portable-Full.tar.gz

      - name: Package Lite version (no node_modules)
        run: |
          mkdir -p deepseek-harness-lite
          rsync -a --exclude='node_modules' deepseek-harness-portable/harness/ deepseek-harness-lite/
          cp deepseek-harness-portable/README.md deepseek-harness-lite/
          tar -czf "DeepSeekHarness-Portable-Lite.tar.gz" deepseek-harness-lite
          ls -lh DeepSeekHarness-Portable-Lite.tar.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-portable
          path: |
            DeepSeekHarness-Portable-Full.tar.gz
            DeepSeekHarness-Portable-Lite.tar.gz
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.version }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --repo 849276022/deepseek-harness-portable \
            DeepSeekHarness-Portable-Full.tar.gz \
            DeepSeekHarness-Portable-Lite.tar.gz \
            --title "DeepSeek Harness Portable $TAG" \
            --notes "## Downloads

          - **Full** (DeepSeekHarness-Portable-Full.tar.gz): Node.js + all deps, extract and run
          - **Lite** (DeepSeekHarness-Portable-Lite.tar.gz): No node_modules, run pnpm install first

          ## Usage
          1. Extract: tar -xzf DeepSeekHarness-Portable-Full.tar.gz
          2. Run: launcher.bat (Windows) or ./launcher.sh (Linux/macOS)
          3. Open: http://127.0.0.1:3000"

      - name: Create Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" \
            --repo 849276022/deepseek-harness-portable \
            DeepSeekHarness-Portable-Full.tar.gz \
            DeepSeekHarness-Portable-Lite.tar.gz \
            --title "DeepSeek Harness Portable $TAG" \
            --generate-notes
