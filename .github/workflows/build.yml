name: Build Portable

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v0.1.2)'
        required: true
        default: 'v0.1.2'
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: '22.19.0'
  PNPM_VERSION: '11.7.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: 'deepseek-ai/deepseek-harness'
          ref: 'master'
          path: 'harness'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies (hoisted)
        working-directory: harness
        run: |
          # --shamefully-hoist: 扁平化 node_modules，避免深层符号链接
          # 这样 Windows 解压后不会断链
          pnpm install --shamefully-hoist --frozen-lockfile

      - name: Build project
        working-directory: harness
        run: pnpm build

      - name: Build web frontend
        working-directory: harness
        run: pnpm run build:web || echo "Web build skipped"

      - name: Build CLI explicitly
        working-directory: harness
        run: |
          pnpm exec tsc -b apps/cli/tsconfig.json
          pnpm exec tsdown --config apps/cli/tsdown.config.ts
          if [ -f "apps/cli/lib/bin.js" ]; then
            echo "✅ CLI built: apps/cli/lib/bin.js"
            ls -la apps/cli/lib/bin.js
          else
            echo "❌ CLI build failed"
            find apps/cli/lib -type f 2>/dev/null || echo "lib/ not found"
            exit 1
          fi

      - name: Download Node.js portable
        run: |
          # 下载 Node.js 便携版 (Windows x64)
          mkdir -p portable
          NODE_URL="https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-win-x64.zip"
          echo "Downloading Node.js from: $NODE_URL"
          curl -sL "$NODE_URL" -o node.zip
          unzip -q node.zip
          mv "node-v${NODE_VERSION}-win-x64" portable/node
          rm node.zip
          echo "✅ Node.js portable downloaded"
          ls -la portable/node/

      - name: Create portable package
        run: |
          mkdir -p portable/src
          # 只复制源码，不复制 node_modules
          # Windows 上首次运行时执行 pnpm install
          cp -r harness/apps portable/src/
          cp -r harness/packages portable/src/
          cp -r harness/vendor portable/src/
          cp -r harness/native portable/src/ 2>/dev/null || true
          cp -r harness/patches portable/src/ 2>/dev/null || true
          cp -r harness/scripts portable/src/ 2>/dev/null || true
          cp harness/package.json portable/src/
          cp harness/pnpm-workspace.yaml portable/src/ 2>/dev/null || true
          cp harness/pnpm-lock.yaml portable/src/ 2>/dev/null || true
          # 复制构建产物（CLI 已编译）
          echo "✅ Portable package created (source only)"
          du -sh portable/
          ls -la portable/src/apps/cli/lib/bin.js

      - name: Create launcher scripts
        run: |
          # Windows launcher - 使用内置 node.exe，首次运行自动安装依赖
          printf '%s\n' \
            '@echo off' \
            'chcp 65001 >nul' \
            'title DeepSeek Harness Portable' \
            '' \
            'cd /d "%~dp0"' \
            '' \
            'echo ========================================' \
            'echo   DeepSeek Harness Portable' \
            'echo ========================================' \
            'echo.' \
            '' \
            'REM 设置内置 Node.js 路径' \
            'set "NODE_EXE=%~dp0node\node.exe"' \
            'set "PATH=%~dp0node;%PATH%"' \
            '' \
            'REM 检查 node.exe 是否存在' \
            'if not exist "%NODE_EXE%" (' \
            '    echo ❌ 找不到内置 Node.js！' \
            '    pause' \
            '    exit /b 1' \
            ')' \
            '' \
            'REM 检查 node_modules 是否存在' \
            'if not exist "src\node_modules" (' \
            '    echo [首次运行] 正在安装依赖...' \
            '    echo 这可能需要几分钟，请耐心等待...' \
            '    echo.' \
            '    cd src' \
            '    pnpm install --shamefully-hoist --frozen-lockfile' \
            '    if errorlevel 1 (' \
            '        echo.' \
            '        echo ❌ 依赖安装失败！请检查：' \
            '        echo    1. 是否已安装 pnpm: npm install -g pnpm' \
            '        echo    2. 网络连接是否正常' \
            '        echo.' \
            '        pause' \
            '        exit /b 1' \
            '    )' \
            '    cd ..' \
            '    echo.' \
            '    echo ✅ 依赖安装完成！' \
            '    echo.' \
            ')' \
            '' \
            'echo   URL: http://127.0.0.1:3000' \
            'echo   Press Ctrl+C to stop' \
            'echo ========================================' \
            'echo.' \
            '' \
            'cd src' \
            '"%NODE_EXE%" apps\cli\lib\bin.js web --port 3000' \
            '' \
            'pause' \
            > portable/launcher.bat

          # Linux/macOS launcher
          printf '%s\n' \
            '#!/bin/bash' \
            'cd "$(dirname "$0")"' \
            '' \
            'echo "========================================"' \
            'echo "  DeepSeek Harness Portable"' \
            'echo "========================================"' \
            'echo ""' \
            '' \
            '# 检查 node_modules 是否存在' \
            'if [ ! -d "node_modules" ]; then' \
            '    echo "[首次运行] 正在安装依赖..."' \
            '    echo "这可能需要几分钟，请耐心等待..."' \
            '    echo ""' \
            '    pnpm install --shamefully-hoist --frozen-lockfile' \
            '    if [ $? -ne 0 ]; then' \
            '        echo ""' \
            '        echo "❌ 依赖安装失败！请检查："' \
            '        echo "   1. 是否已安装 pnpm: npm install -g pnpm"' \
            '        echo "   2. 网络连接是否正常"' \
            '        echo ""' \
            '        exit 1' \
            '    fi' \
            '    echo ""' \
            '    echo "✅ 依赖安装完成！"' \
            '    echo ""' \
            'fi' \
            '' \
            'echo "  URL: http://127.0.0.1:3000"' \
            'echo "  Press Ctrl+C to stop"' \
            'echo "========================================"' \
            'echo ""' \
            '' \
            'node apps/cli/lib/bin.js web --port 3000' \
            > portable/launcher.sh
          chmod +x portable/launcher.sh

          # README
          printf '%s\n' \
            '# DeepSeek Harness Portable' \
            '' \
            '## Quick Start' \
            '' \
            '### Windows' \
            'Double-click `launcher.bat`' \
            '' \
            '### Linux/macOS' \
            '```bash' \
            './launcher.sh' \
            '```' \
            '' \
            '**首次运行**会自动安装依赖（需要 pnpm），可能需要几分钟。' \
            '' \
            'Then open http://127.0.0.1:3000' \
            '' \
            '## Requirements' \
            '' \
            '- Node.js 22.19+' \
            '- pnpm (`npm install -g pnpm`)' \
            > portable/README.md

      - name: Verify startup
        working-directory: portable/src
        run: |
          ls -la apps/cli/lib/bin.js
          # 安装依赖（验证环境）
          echo "安装依赖..."
          pnpm install --shamefully-hoist --frozen-lockfile
          echo "启动验证..."
          node apps/cli/lib/bin.js web --port 3000 &
          PID=$!
          sleep 8

          if kill -0 $PID 2>/dev/null; then
            echo "✅ Startup verification passed"
            if curl -sf -o /dev/null http://127.0.0.1:3000; then
              echo "✅ HTTP endpoint responding"
            else
              echo "⚠️ HTTP not responding yet (may need more time)"
            fi
            kill $PID 2>/dev/null || true
            wait $PID 2>/dev/null || true
          else
            echo "❌ Startup FAILED"
            exit 1
          fi

      - name: Package tarball
        run: |
          # 打包前清理 node_modules（首次运行会重新安装）
          rm -rf portable/src/node_modules
          tar -czf "DeepSeekHarness-Portable.tar.gz" portable
          ls -lh DeepSeekHarness-Portable.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-portable
          path: DeepSeekHarness-Portable.tar.gz
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --repo 849276022/deepseek-harness-portable \
            DeepSeekHarness-Portable.tar.gz \
            --title "DeepSeek Harness Portable $TAG" \
            --notes "## Downloads

          - **DeepSeekHarness-Portable.tar.gz**: Full portable package

          ## Usage
          1. Extract: tar -xzf DeepSeekHarness-Portable.tar.gz
          2. Run: launcher.bat (Windows) or ./launcher.sh (Linux/macOS)
          3. Open: http://127.0.0.1:3000

          ## Requirements
          - Node.js 22.19+
          "
