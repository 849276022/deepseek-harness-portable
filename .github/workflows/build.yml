name: Build Portable

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v0.1.2)'
        required: true
        default: 'v0.3.1'
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: '22.19.0'
  PNPM_VERSION: '11.7.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout self (plugins + workflow)
        uses: actions/checkout@v4
        with:
          path: 'self'

      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: 'deepseek-ai/deepseek-harness'
          ref: 'master'
          path: 'harness'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies (hoisted)
        working-directory: harness
        run: |
          # --shamefully-hoist: 扁平化 node_modules，避免深层符号链接
          # 这样 Windows 解压后不会断链
          pnpm install --shamefully-hoist --frozen-lockfile

      - name: Build project
        working-directory: harness
        run: pnpm build

      - name: Build web frontend
        working-directory: harness
        run: pnpm run build:web || echo "Web build skipped"

      - name: Build CLI explicitly
        working-directory: harness
        run: |
          pnpm exec tsc -b apps/cli/tsconfig.json
          pnpm exec tsdown --config apps/cli/tsdown.config.ts
          if [ -f "apps/cli/lib/bin.js" ]; then
            echo "✅ CLI built: apps/cli/lib/bin.js"
            ls -la apps/cli/lib/bin.js
          else
            echo "❌ CLI build failed"
            find apps/cli/lib -type f 2>/dev/null || echo "lib/ not found"
            exit 1
          fi

      - name: Download Node.js portable
        run: |
          # 下载 Node.js 便携版 (Windows x64)
          mkdir -p portable
          NODE_URL="https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-win-x64.zip"
          echo "Downloading Node.js from: $NODE_URL"
          curl -sL "$NODE_URL" -o node.zip
          unzip -q node.zip
          mv "node-v${NODE_VERSION}-win-x64" portable/node
          rm node.zip
          echo "✅ Node.js portable downloaded"
          ls -la portable/node/

      - name: Create portable package
        run: |
          mkdir -p portable/src
          # 只复制源码，不复制 node_modules
          # Windows 上首次运行时执行 pnpm install
          cp -r harness/apps portable/src/
          cp -r harness/packages portable/src/
          cp -r harness/vendor portable/src/
          cp -r harness/native portable/src/ 2>/dev/null || true
          cp -r harness/patches portable/src/ 2>/dev/null || true
          cp -r harness/scripts portable/src/ 2>/dev/null || true
          cp harness/package.json portable/src/
          cp harness/pnpm-workspace.yaml portable/src/ 2>/dev/null || true
          cp harness/pnpm-lock.yaml portable/src/ 2>/dev/null || true
          # 复制构建产物（CLI 已编译）
          echo "✅ Portable package created (source only)"
          du -sh portable/
          ls -la portable/src/apps/cli/lib/bin.js

      - name: Bundle official QQ Bot installer
        run: |
          # 不再自带自研 QQ 插件：改用腾讯官方 @tencent-connect/dsh-qqbot
          # （github.com/tencent-connect/dsh-qqbot，MIT）。官方 npm 包自带
          # 编译好的 dist/，无需 build。
          #
          # 首次进入 QQ 模式时由 launcher 调 scripts/install-qqbot.mjs 安装，
          # 不预装进发布包：pnpm 装出的 node_modules 含平台相关符号链接，
          # 打包再解压会断链。
          mkdir -p portable/scripts
          cp self/scripts/install-qqbot.mjs portable/scripts/
          node --check portable/scripts/install-qqbot.mjs
          echo "OK: install-qqbot.mjs bundled and syntax-checked"
          ls -la portable/scripts/

      - name: Create launcher scripts
        run: |
          # launcher.bat 必须是纯 ASCII —— cmd 默认 GBK，中文会导致 exit 255。
          cp self/launcher/launcher.bat portable/launcher.bat
          cp self/launcher/launcher.sh portable/launcher.sh
          chmod +x portable/launcher.sh

          # 守卫：非 ASCII 字符直接让构建失败，避免再犯 GBK 那个坑。
          if LC_ALL=C grep -qP '[^\x00-\x7F]' portable/launcher.bat; then
            echo "FAIL: launcher.bat contains non-ASCII characters"
            LC_ALL=C grep -nP '[^\x00-\x7F]' portable/launcher.bat
            exit 1
          fi
          echo "OK: launcher.bat is pure ASCII"

          # 菜单三个入口必须都在
          for marker in ":WEB" ":QQBOT" ":SETCRED"; do
            grep -q "$marker" portable/launcher.bat || {
              echo "FAIL: launcher.bat missing $marker"; exit 1; }
          done
          echo "OK: launcher menu targets present"

          printf '%s\n' \
            '# DeepSeek Harness Portable' \
            '' \
            '## Quick Start' \
            '' \
            '### Windows' \
            'Double-click `launcher.bat`, then pick a mode:' \
            '' \
            '- `[1] Web UI` - browser at http://127.0.0.1:3000' \
            '- `[2] QQ Bot` - talk to the agent on QQ' \
            '- `[3] Set QQ creds` - enter AppID / AppSecret' \
            '' \
            '### Linux/macOS' \
            '```bash' \
            './launcher.sh' \
            '```' \
            '' \
            '## QQ Bot' \
            '' \
            'Powered by the official Tencent plugin' \
            '[@tencent-connect/dsh-qqbot](https://github.com/tencent-connect/dsh-qqbot).' \
            'Installed automatically the first time you pick QQ mode.' \
            '' \
            'Get AppID / AppSecret at <https://q.qq.com>.' \
            'Credentials are stored in `data/qqbot.env` and never leave your machine.' \
            '' \
            'A model API key must be configured in the Web UI (Settings -> Models) first,' \
            'otherwise the bot replies with MISSING_CREDENTIAL.' \
            '' \
            '## Requirements' \
            '' \
            '- Node.js 22.19+ (bundled on Windows)' \
            '- pnpm (`npm install -g pnpm`)' \
            > portable/README.md

      - name: Lint launcher.bat quoting
        run: |
          BAT=portable/launcher.bat

          # %~dp0 ends with a backslash. Inside "..." that backslash escapes the
          # closing quote, so "%~dp0" hands  E:\path\portable"  to the callee.
          # A real user hit exactly this: 'cannot find src dir: ...portable"\src'.
          # cd /d "%~dp0" is fine (cd tolerates it); passing it as an ARGUMENT is not.
          # Deliberately NOT using grep -P: it dies with "supports only unibyte and
          # UTF-8 locales" on some runners and the guard would silently pass.
          HITS=$(grep -nF '"%~dp0"' "$BAT" | grep -v 'cd /d' || true)
          if [ -n "$HITS" ]; then
            echo "FAIL: bare \"%~dp0\" passed as an argument - use \"%~dp0.\" instead"
            echo "$HITS"
            exit 1
          fi
          echo "OK: no unsafe %~dp0 argument quoting"

          # cmd.exe defaults to GBK on Chinese Windows; non-ASCII bytes in a .bat
          # break parsing with exit 255.
          if LC_ALL=C grep -q '[^ -~	]' "$BAT"; then
            echo "FAIL: launcher.bat contains non-ASCII bytes"
            LC_ALL=C grep -n '[^ -~	]' "$BAT" | head
            exit 1
          fi
          echo "OK: launcher.bat is pure ASCII"

      - name: Verify startup
        working-directory: portable/src
        run: |
          ls -la apps/cli/lib/bin.js
          # 安装依赖（验证环境）
          echo "安装依赖..."
          pnpm install --shamefully-hoist --frozen-lockfile
          echo "启动验证..."
          node apps/cli/lib/bin.js web --port 3000 &
          PID=$!
          sleep 8

          if kill -0 $PID 2>/dev/null; then
            echo "✅ Startup verification passed"
            if curl -sf -o /dev/null http://127.0.0.1:3000; then
              echo "✅ HTTP endpoint responding"
            else
              echo "⚠️ HTTP not responding yet (may need more time)"
            fi
            kill $PID 2>/dev/null || true
            wait $PID 2>/dev/null || true
          else
            echo "❌ Startup FAILED"
            exit 1
          fi

      - name: Verify official QQ Bot plugin installs and boots
        working-directory: portable
        run: |
          # 必须在 "Verify startup" 之后：那一步才 pnpm install，
          # 否则 CLI 连 commander 都找不到。
          #
          # 三层验证，缺一层就是假绿：
          #   1) 安装脚本能在干净环境装上官方包
          #   2) 解析后的配置树里有 im-qqbot
          #   3) 真启动，插件 apply 真执行（不能只看文件在不在）
          set -e
          export DSH_HOME="$GITHUB_WORKSPACE/portable/data/.dsh"
          export DSH_AGENTS_HOME="$GITHUB_WORKSPACE/portable/data/.agents"
          mkdir -p "$DSH_HOME"

          echo "--- 1/3 干净环境安装官方插件 ---"
          # 关键坑：profile 的 package.json 绝不能预写 "dependencies": {}，
          # pnpm 见到空依赖直接回 "Already up to date"，什么都不装。
          # install-qqbot.mjs 只写 name + private，让 pnpm 自己写依赖。
          rm -rf "$DSH_HOME/profiles/qqbot"
          node scripts/install-qqbot.mjs "$GITHUB_WORKSPACE/portable"

          INSTALLED="$DSH_HOME/profiles/qqbot/node_modules/@tencent-connect/dsh-qqbot/dist/index.js"
          if [ ! -f "$INSTALLED" ]; then
            echo "FAIL: official plugin entry missing at $INSTALLED"
            find "$DSH_HOME/profiles/qqbot" -maxdepth 3 -type d 2>/dev/null | head -20
            exit 1
          fi
          echo "OK: official plugin installed"

          echo "--- 2/3 解析生效配置 ---"
          cd src
          node apps/cli/lib/bin.js --profile qqbot --dump-config > /tmp/dump.yml
          if grep -q "im-qqbot" /tmp/dump.yml; then
            echo "OK: im-qqbot present in resolved config"
            grep -A6 "im-qqbot" /tmp/dump.yml | head -12
          else
            echo "FAIL: im-qqbot missing from resolved config"
            head -60 /tmp/dump.yml
            exit 1
          fi

          echo "--- 3/3 真启动验证 ---"
          # 凭据走环境变量（官方设计，dump-config 里显示 __FROM_ENV__）。
          # CI 用假凭据：只验证插件 apply 执行到位，鉴权失败是预期的。
          export QQBOT_APPID="ci-test-appid"
          export QQBOT_SECRET="ci-test-secret"
          set +e
          timeout 60 node apps/cli/lib/bin.js --profile qqbot > /tmp/boot.log 2>&1
          set -e

          echo "--- 启动日志 ---"
          cat /tmp/boot.log

          if grep -q "ERR_MODULE_NOT_FOUND\|plugin tree failed to load\|failed to import loader entry" /tmp/boot.log; then
            echo "FAIL: plugin failed to load"
            exit 1
          fi
          if grep -q "im-qqbot" /tmp/boot.log; then
            echo "OK: official QQ Bot plugin applied at boot"
          else
            echo "FAIL: no im-qqbot activity in boot log"
            exit 1
          fi

          rm -f /tmp/dump.yml /tmp/boot.log
          rm -rf "$DSH_HOME/profiles/qqbot"

      - name: Package tarball
        run: |
          # 打包前清理 node_modules（首次运行会重新安装）
          rm -rf portable/src/node_modules
          # 清理 CI 验证产生的临时 profile 与依赖，避免混入发布包
          rm -rf portable/data
          # 确认官方安装脚本仍在包内
          ls -la portable/scripts/install-qqbot.mjs
          tar -czf "DeepSeekHarness-Portable.tar.gz" portable
          ls -lh DeepSeekHarness-Portable.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-portable
          path: DeepSeekHarness-Portable.tar.gz
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --repo 849276022/deepseek-harness-portable \
            DeepSeekHarness-Portable.tar.gz \
            --title "DeepSeek Harness Portable $TAG" \
            --notes "## Downloads

          - **DeepSeekHarness-Portable.tar.gz**: Full portable package

          ## Usage
          1. Extract: tar -xzf DeepSeekHarness-Portable.tar.gz
          2. Run: launcher.bat (Windows) or ./launcher.sh (Linux/macOS)
          3. Open: http://127.0.0.1:3000

          ## Requirements
          - Node.js 22.19+
          "
