name: Build Portable

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v0.1.2)'
        required: true
        default: 'v0.1.2'
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: '22.19.0'
  PNPM_VERSION: '11.7.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: 'deepseek-ai/deepseek-harness'
          ref: 'master'
          path: 'harness'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: |
          cd harness
          pnpm install --frozen-lockfile

      - name: Build project
        run: |
          cd harness
          pnpm build

      - name: Build web frontend
        run: |
          cd harness
          pnpm run build:web || echo "Web build skipped"

      - name: Create portable package
        run: |
          mkdir -p portable
          cd harness
          
          # 复制核心文件
          cp -r apps portable/
          cp -r packages portable/
          cp -r vendor portable/
          cp package.json portable/
          cp pnpm-workspace.yaml portable/ 2>/dev/null || true
          cp pnpm-lock.yaml portable/ 2>/dev/null || true
          
          # 复制 node_modules（包含所有依赖，包括 vendor 链接）
          cp -r node_modules portable/
          
          cd ..
          echo "Portable package created"
          du -sh portable/

      - name: Create launcher scripts
        run: |
          # Windows launcher
          cat > portable/launcher.bat << 'EOF'
          @echo off
          chcp 65001 >nul
          title DeepSeek Harness Portable
          
          cd /d "%~dp0"
          
          echo ========================================
          echo   DeepSeek Harness Portable
          echo   URL: http://127.0.0.1:3000
          echo   Press Ctrl+C to stop
          echo ========================================
          echo.
          
          node apps/cli/lib/bin.js web --port 3000
          
          pause
          EOF
          
          # Linux/macOS launcher
          cat > portable/launcher.sh << 'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          
          echo "========================================"
          echo "  DeepSeek Harness Portable"
          echo "  URL: http://127.0.0.1:3000"
          echo "  Press Ctrl+C to stop"
          echo "========================================"
          echo ""
          
          node apps/cli/lib/bin.js web --port 3000
          EOF
          chmod +x portable/launcher.sh
          
          # README
          cat > portable/README.md << 'EOF'
          # DeepSeek Harness Portable
          
          ## Quick Start
          
          ### Windows
          Double-click `launcher.bat`
          
          ### Linux/macOS
          ```bash
          ./launcher.sh
          ```
          
          Then open http://127.0.0.1:3000
          
          ## Requirements
          
          - Node.js 22.19+
          EOF

      - name: Verify startup
        run: |
          cd portable
          # 启动验证：运行 5 秒后检查是否成功
          timeout 5 node apps/cli/lib/bin.js web --port 3000 &
          PID=$!
          sleep 3
          
          # 检查进程是否还在运行
          if kill -0 $PID 2>/dev/null; then
            echo "✅ Startup verification passed"
            kill $PID 2>/dev/null || true
          else
            echo "❌ Startup verification failed"
            exit 1
          fi

      - name: Package tarball
        run: |
          tar -czf "DeepSeekHarness-Portable.tar.gz" portable
          ls -lh DeepSeekHarness-Portable.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-portable
          path: DeepSeekHarness-Portable.tar.gz
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --repo 849276022/deepseek-harness-portable \
            DeepSeekHarness-Portable.tar.gz \
            --title "DeepSeek Harness Portable $TAG" \
            --notes "## Downloads

          - **DeepSeekHarness-Portable.tar.gz**: 完整便携包，解压即用

          ## Usage
          1. 解压: tar -xzf DeepSeekHarness-Portable.tar.gz
          2. 运行: launcher.bat (Windows) 或 ./launcher.sh (Linux/macOS)
          3. 打开: http://127.0.0.1:3000

          ## Requirements
          - Node.js 22.19+
          "
