name: Build Portable

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v0.1.2)'
        required: true
        default: 'v0.1.2'
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: '22.19.0'
  PNPM_VERSION: '11.7.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: 'deepseek-ai/deepseek-harness'
          ref: 'master'
          path: 'harness'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: |
          cd harness
          pnpm install --frozen-lockfile

      - name: Build project
        run: |
          cd harness
          pnpm build

      - name: Build web frontend
        run: |
          cd harness
          pnpm run build:web || echo "Web build skipped"

      - name: Create portable package
        run: |
          mkdir -p portable
          cd harness

          # Copy core directories (apps, packages, vendor)
          cp -r apps portable/
          cp -r packages portable/
          cp -r vendor portable/
          cp package.json portable/
          cp pnpm-workspace.yaml portable/ 2>/dev/null || true
          cp pnpm-lock.yaml portable/ 2>/dev/null || true

          # Copy node_modules (includes all deps + vendor links)
          cp -r node_modules portable/

          cd ..
          echo "Portable package created"
          du -sh portable/

      - name: Create launcher scripts
        run: |
          # Windows launcher
          printf '%s\n' \
            '@echo off' \
            'chcp 65001 >nul' \
            'title DeepSeek Harness Portable' \
            '' \
            'cd /d "%~dp0"' \
            '' \
            'echo ========================================' \
            'echo   DeepSeek Harness Portable' \
            'echo   URL: http://127.0.0.1:3000' \
            'echo   Press Ctrl+C to stop' \
            'echo ========================================' \
            'echo.' \
            '' \
            'node apps\cli\lib\bin.js web --port 3000' \
            '' \
            'pause' \
            > portable/launcher.bat

          # Linux/macOS launcher
          printf '%s\n' \
            '#!/bin/bash' \
            'cd "$(dirname "$0")"' \
            '' \
            'echo "========================================"' \
            'echo "  DeepSeek Harness Portable"' \
            'echo "  URL: http://127.0.0.1:3000"' \
            'echo "  Press Ctrl+C to stop"' \
            'echo "========================================"' \
            'echo ""' \
            '' \
            'node apps/cli/lib/bin.js web --port 3000' \
            > portable/launcher.sh
          chmod +x portable/launcher.sh

          # README
          printf '%s\n' \
            '# DeepSeek Harness Portable' \
            '' \
            '## Quick Start' \
            '' \
            '### Windows' \
            'Double-click `launcher.bat`' \
            '' \
            '### Linux/macOS' \
            '```bash' \
            './launcher.sh' \
            '```' \
            '' \
            'Then open http://127.0.0.1:3000' \
            '' \
            '## Requirements' \
            '' \
            '- Node.js 22.19+' \
            > portable/README.md

      - name: Verify startup
        run: |
          cd portable
          # Start the server in background and verify it boots
          node apps/cli/lib/bin.js web --port 3000 &
          PID=$!
          sleep 5

          # Check if process is still running (means it started successfully)
          if kill -0 $PID 2>/dev/null; then
            echo "✅ Startup verification passed - server is running"
            # Also try to hit the endpoint
            if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000 | grep -q "200\|301\|302\|404"; then
              echo "✅ HTTP endpoint responding"
            else
              echo "⚠️ HTTP endpoint not responding yet (may need more time)"
            fi
            kill $PID 2>/dev/null || true
            wait $PID 2>/dev/null || true
          else
            echo "❌ Startup verification FAILED - process exited"
            echo "This means the portable package is broken."
            echo "Common causes: missing dependencies, broken vendor links"
            exit 1
          fi

      - name: Package tarball
        run: |
          tar -czf "DeepSeekHarness-Portable.tar.gz" portable
          ls -lh DeepSeekHarness-Portable.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-portable
          path: DeepSeekHarness-Portable.tar.gz
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --repo 849276022/deepseek-harness-portable \
            DeepSeekHarness-Portable.tar.gz \
            --title "DeepSeek Harness Portable $TAG" \
            --notes "## Downloads

          - **DeepSeekHarness-Portable.tar.gz**: Full portable package

          ## Usage
          1. Extract: tar -xzf DeepSeekHarness-Portable.tar.gz
          2. Run: launcher.bat (Windows) or ./launcher.sh (Linux/macOS)
          3. Open: http://127.0.0.1:3000

          ## Requirements
          - Node.js 22.19+
          "
